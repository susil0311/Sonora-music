name: Android Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > sonora-release.jks
        {
          echo "storeFile=sonora-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed ARMv7 and ARM64 Prod Release APKs
      run: ./gradlew assembleProdRelease

    - name: Stage separately named ARM APKs
      env:
        RELEASE_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        output="app/build/outputs/apk/prod/release"
        mkdir -p release-assets
        for abi in armeabi-v7a arm64-v8a; do
          mapfile -t matches < <(find "$output" -maxdepth 1 -type f -name "*-${abi}.apk" | sort)
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "Expected one APK for ${abi}; found ${#matches[@]} in ${output}" >&2
            exit 1
          fi
          cp "${matches[0]}" "release-assets/Sonora-${RELEASE_NAME}_${abi}.apk"
        done

    - name: Upload ARMv7 APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: sonora-prod-release-${{ github.ref_name }}-armeabi-v7a
        path: release-assets/Sonora-${{ github.ref_name }}_armeabi-v7a.apk
        if-no-files-found: error

    - name: Upload ARM64 APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: sonora-prod-release-${{ github.ref_name }}-arm64-v8a
        path: release-assets/Sonora-${{ github.ref_name }}_arm64-v8a.apk
        if-no-files-found: error

    - name: Attach separate APKs to the GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*.apk
        fail_on_unmatched_files: true

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, so a prod watch APK
    # for these phone builds can only come from here, never a local build.
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sonora-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
